# Local Kind images are loaded into the node before Argo CD syncs the chart.
# CI publishes separate SHA-tagged GHCR images for the release pipeline.
image:
  backend:
    repository: labpulse-backend
    tag: 22aa496b517c
    pullPolicy: IfNotPresent
  frontend:
    repository: labpulse-frontend
    tag: 22aa496b517c
    pullPolicy: IfNotPresent

ingress:
  host: localhost

# A visible GitOps change for the presentation: Argo CD reconciles three web pods.
frontend:
  replicas: 3
