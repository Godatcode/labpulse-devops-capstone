apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: labpulse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Godatcode/labpulse-devops-capstone.git
    targetRevision: main
    path: helm/labpulse
    helm:
      releaseName: labpulse
      valueFiles:
        - values-gitops.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: labpulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
